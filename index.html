<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1b2f" />
    <title>江戸RPG</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0d0d14; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      body { display: flex; flex-direction: column; }
      #game { flex: 1; min-height: 0; }
      canvas { image-rendering: pixelated; }
      /* 仮想パッド: タッチ操作の端末でだけ出す */
      #pad { display: none; }
      @media (pointer: coarse) {
        #pad { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px calc(16px + env(safe-area-inset-bottom)); height: 150px; box-sizing: border-box; }
        /* 横持ちでは画面の左右に重ねる */
        @media (orientation: landscape) {
          #pad { position: fixed; inset: auto 0 0 0; background: none; pointer-events: none; height: 140px; }
          #pad > * { pointer-events: auto; opacity: 0.55; }
        }
      }
      .dpad { display: grid; grid-template: repeat(3, 40px) / repeat(3, 40px); gap: 2px; }
      .btn { border: 2px solid #e8dcc0; background: #1b1b2f; color: #f4ecd8; border-radius: 8px; font: 16px sans-serif; display: flex; align-items: center; justify-content: center; touch-action: none; }
      .btn.active { background: #e8b04a; color: #1b1b2f; }
      .dpad .up { grid-area: 1 / 2; } .dpad .left { grid-area: 2 / 1; } .dpad .right { grid-area: 2 / 3; } .dpad .down { grid-area: 3 / 2; }
      .actions { display: flex; gap: 16px; align-items: flex-end; }
      .actions .btn { width: 60px; height: 60px; border-radius: 50%; }
      .actions .ok { margin-bottom: 30px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="pad" aria-hidden="true">
      <div class="dpad">
        <div class="btn up" data-key="up">▲</div>
        <div class="btn left" data-key="left">◀</div>
        <div class="btn right" data-key="right">▶</div>
        <div class="btn down" data-key="down">▼</div>
      </div>
      <div class="actions">
        <div class="btn cancel" data-key="cancel">取消</div>
        <div class="btn ok" data-key="ok">決定</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
